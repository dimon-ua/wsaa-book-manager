<!-- Bootstrap Link: https://getbootstrap.com/docs/4.1/content/tables/ -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Books</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css">
  </head>
<body>
    <div class="container mt-5">   
        <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Books</h1>
    <a href="{{ url_for('logout') }}" class="btn btn-warning">Logout</a>
</div>
        <div class="card mb-4">
    <div class="card-body">
        <h5 class="card-title">Add New Book</h5>

        <form action="/add_book" method="POST" class="form-inline">
            <input type="text" name="title" class="form-control mr-2" placeholder="Title" required>
            <input type="text" name="author" class="form-control mr-2" placeholder="Author" required>            
            <input type="number" step="0.01" name="price" class="form-control mr-2" placeholder="Price">
            <input type="text" name="isbn" class="form-control mr-2" placeholder="ISBN">
            <button type="submit" class="btn btn-success">Add</button>
        </form>
    </div>
</div>
        <table class="table table-striped table-hover">
            <thead class="thead-dark">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Cover</th>
                    <th scope="col">Title</th>
                    <th scope="col">Author</th>
                    <th scope="col">Price</th>
                    <th scope="col">ISBN</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for book in books %}
                 <tr>
                    <th scope="row">{{ book.id }}</th><td>
                        <img src="https://covers.openlibrary.org/b/isbn/{{ book.isbn }}-M.jpg"
                        width="50" alt="Book Cover" class="img-thumbnail"></td>
                    
                    <td>{{ book.title }}</td>
                    <td>{{ book.author }}</td>
                    <td>{{ book.price }}</td>
                    <td>{{ book.isbn }}</td>
                    <td>                             
                            <a href="{{ url_for('edit_book', book_id=book.id) }}" 
                               class="btn btn-outline-primary btn-sm">Edit</a>
                            <a href="{{ url_for('delete_book', book_id=book.id) }}" 
                                class="btn btn-outline-danger btn-sm"
                                onclick="return confirm('Are you sure?')">
                                Delete
                                </a>
                            </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>        
    </div>

    <div class="container mt-4">
    <h4>Our Authors</h4>
    <ul>
        {% for book in books %}
            <li>{{ book.author }}</li>
        {% endfor %}
    </ul>
</div>

</body>
</html>
