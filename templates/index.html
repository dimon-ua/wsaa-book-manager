<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Books</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css">
  </head>
<body>
    <div class="container mt-5">   
        <h1 class="mb-4">Books</h1>
        <div class="card mb-4">
    <div class="card-body">
        <h5 class="card-title">Add New Book</h5>
        <form action="/api/books" method="POST" class="form-inline">
            <input type="text" name="title" class="form-control mr-2" placeholder="Title" required>
            <input type="text" name="author" class="form-control mr-2" placeholder="Author" required>
            <input type="text" name="isbn" class="form-control mr-2" placeholder="ISBN">
            <input type="number" step="0.01" name="price" class="form-control mr-2" placeholder="Price">
            <button type="submit" class="btn btn-success">Add</button>
        </form>
    </div>
</div>
        <table class="table table-striped table-hover">
            <thead class="thead-dark">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Title</th>
                    <th scope="col">Author</th>
                    <th scope="col">Price</th>
                    <th scope="col">ISBN</th>
                </tr>
            </thead>
            <tbody>
                {% for book in books %}
                 <tr>
                    <th scope="row">{{ book.id }}</th>
                    <td>{{ book.title }}</td>
                    <td>{{ book.author }}</td>
                    <td>{{ book.price }}</td>
                    <td>{{ book.isbn }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>        
    </div>
</body>
</html>
